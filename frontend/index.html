<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agente Ana — sua nota fiscal no automático</title>
    <meta name="description" content="A Ana emite suas notas fiscais de serviço todo mês: cadastre cada fornecedor uma vez e só confira. Feito pra afiliados e criadores de conteúdo." />
    <meta property="og:title" content="Agente Ana — sua nota fiscal no automático" />
    <meta property="og:description" content="Cadastre cada fornecedor uma vez. Todo mês a Ana prepara, emite e envia a nota — você só confere." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#131b3f" />
    <script>
      // Aplica o tema ANTES do React montar, pra não piscar claro->escuro
      // num reload com tema escuro salvo (ver src/lib/theme.tsx, que faz a
      // mesma leitura — este script só evita o flash inicial).
      (function () {
        try {
          var salvo = localStorage.getItem("notafacil.tema");
          var escuro = salvo === "escuro" || (!salvo && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", escuro);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
